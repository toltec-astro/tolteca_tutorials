<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="220" viewBox="0 0 1152 220" role="img" aria-label="Acquire, process, publish and explore">
<title>Acquire, process, publish and explore</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70869a"/></marker></defs>
