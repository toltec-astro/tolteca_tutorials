<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="versions-title versions-desc" style="font-family:Arial,Helvetica,sans-serif;width:100%;max-height:320px">
<title id="versions-title">Version-group alternatives</title><desc id="versions-desc">A group has two exact realizations. Its main tag selects realization B.</desc>
